name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'apppk/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: apppk
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter==5.2.2 requests pyinstaller

      - name: Build EXE
        working-directory: apppk
        run: |
          pyinstaller --noconfirm --onefile --windowed --name RedSaveControl app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedSaveControl-Windows
          path: apppk/dist/RedSaveControl.exe
          retention-days: 90
