<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(8px);
        }
        .card {
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 56px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            max-width: 420px;
            width: 90%;
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a0a0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-align: center;
        }
        input:focus {
            border-color: rgba(100, 100, 255, 0.6);
            background: rgba(100, 100, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(100, 100, 255, 0.1);
        }
        button {
            padding: 16px 28px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            height: 18px;
        }
        .success-content {
            display: none;
        }
        .success-content h1 {
            font-size: 42px;
            margin-bottom: 4px;
        }
        .success-content .sub {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
        }
        .fade-out {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="overlay">
        <!-- Экран входа -->
        <div class="card" id="login-card">
            <h1>Access Panel</h1>
            <p>Введите пароль для входа</p>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="••••••••" autocomplete="off">
                <button onclick="checkPassword()">Войти</button>
            </div>
            <div class="error" id="error-msg"></div>
        </div>

        <!-- Экран после входа -->
        <div class="card success-content" id="success-card">
            <h1>Работает</h1>
            <p class="sub">Панель управления активна</p>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ===== 3D СЦЕНА =====
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Постобработка (Bloom)
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.85
        );
        composer.addPass(bloomPass);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x6366f1, 2, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x8b5cf6, 2, 50);
        pointLight2.position.set(-10, -10, 10);
        scene.add(pointLight2);

        // Центральный объект (ТорусКнот)
        const knotGeometry = new THREE.TorusKnotGeometry(6, 1.8, 200, 32);
        const knotMaterial = new THREE.MeshStandardMaterial({
            color: 0x6366f1,
            emissive: 0x1a1a4e,
            metalness: 0.9,
            roughness: 0.15,
        });
        const knot = new THREE.Mesh(knotGeometry, knotMaterial);
        scene.add(knot);

        // Частицы (звёздное поле)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 120;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            color: 0x8888ff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
        });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Дополнительные кольца
        const ringGeometry = new THREE.TorusGeometry(12, 0.08, 16, 100);
        const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.2 });
        const ring1 = new THREE.Mesh(ringGeometry, ringMaterial);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);
        const ring2 = new THREE.Mesh(ringGeometry, ringMaterial);
        ring2.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 4;
        scene.add(ring2);

        // ===== АНИМАЦИЯ =====
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // Вращение ТорусКнота
            knot.rotation.x = elapsed * 0.3;
            knot.rotation.y = elapsed * 0.4;

            // Пульсация
            const scale = 1 + Math.sin(elapsed * 2) * 0.03;
            knot.scale.set(scale, scale, scale);

            // Вращение частиц
            particles.rotation.y = elapsed * 0.02;
            particles.rotation.x = elapsed * 0.01;

            // Кольца
            ring1.rotation.z = elapsed * 0.1;
            ring2.rotation.z = -elapsed * 0.15;

            // Параллакс камеры за мышью
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.02;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);

            // Движение света
            pointLight1.position.x = Math.sin(elapsed * 0.5) * 15;
            pointLight1.position.y = Math.cos(elapsed * 0.5) * 15;
            pointLight2.position.x = Math.sin(elapsed * 0.7 + 2) * 15;
            pointLight2.position.y = Math.cos(elapsed * 0.7 + 2) * 15;

            composer.render();
        }
        animate();

        // ===== АДАПТИВНОСТЬ =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== ПРОВЕРКА ПАРОЛЯ ЧЕРЕЗ API =====
        window.checkPassword = async function() {
            const input = document.getElementById('password-input');
            const errorEl = document.getElementById('error-msg');
            const password = input.value.trim();

            if (!password) {
                errorEl.textContent = 'Введите пароль';
                return;
            }

            errorEl.textContent = '';

            try {
                const response = await fetch('/api/check-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    // Успех
                    const loginCard = document.getElementById('login-card');
                    const successCard = document.getElementById('success-card');

                    loginCard.classList.add('fade-out');
                    setTimeout(() => {
                        loginCard.style.display = 'none';
                        successCard.style.display = 'block';
                        successCard.classList.add('fade-in');
                    }, 300);
                } else {
                    errorEl.textContent = 'Неверный пароль';
                    input.value = '';
                    input.focus();
                }
            } catch (err) {
                errorEl.textContent = 'Ошибка соединения';
                console.error(err);
            }
        };

        // Enter для отправки
        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
