<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSave — Bot Dashboard</title>
    <meta name="theme-color" content="#0a0a0a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-card: rgba(20, 20, 30, 0.75);
            --bg-input: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        [data-theme="cyberpunk"] {
            --accent: #ff00ff;
            --accent-2: #00ffff;
            --bg-primary: #0d0221;
            --bg-card: rgba(30, 0, 60, 0.75);
        }
        [data-theme="oxford"] {
            --accent: #d4a574;
            --accent-2: #8b5a2b;
            --bg-primary: #1a1410;
            --bg-card: rgba(40, 30, 20, 0.75);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background 0.5s;
        }

        /* ===== LOADER ===== */
        .loader-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .loader-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loader {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        .loader svg {
            width: 100%;
            height: auto;
        }
        .trace-bg {
            stroke: #333;
            stroke-width: 1.8;
            fill: none;
        }
        .trace-flow {
            stroke-width: 1.8;
            fill: none;
            stroke-dasharray: 40 400;
            stroke-dashoffset: 438;
            filter: drop-shadow(0 0 6px currentColor);
            animation: flow 3s cubic-bezier(0.5, 0, 0.9, 1) infinite;
        }
        .yellow { stroke: #ffea00; color: #ffea00; }
        .blue { stroke: #00ccff; color: #00ccff; }
        .green { stroke: #00ff15; color: #00ff15; }
        .purple { stroke: #9900ff; color: #9900ff; }
        .red { stroke: #ff3300; color: #ff3300; }
        @keyframes flow {
            to { stroke-dashoffset: 0; }
        }

        /* ===== 3D ФОН ===== */
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== ОВЕРЛЕЙ ===== */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(8px);
            overflow-y: auto;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 48px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }
        input, select {
            flex: 1;
            padding: 16px 20px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        button {
            padding: 16px 28px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            position: relative;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.4);
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            color: var(--error);
            font-size: 13px;
            margin-top: 12px;
            height: 18px;
        }
        .success-content { display: none; }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }
        .status-dot.offline { background: var(--error); animation: none; }
        .status-dot.degraded { background: var(--warning); animation: pulse 1s infinite; }
        .status-dot.unknown { background: var(--warning); animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .logout-btn, .theme-btn, .ping-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            font-family: inherit;
            white-space: nowrap;
        }
        .tab:hover { color: var(--text-primary); }
        .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }
        .tab-content { display: none; text-align: left; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-bar input, .search-bar select {
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 10px;
        }
        .search-bar input { flex: 2; }
        .search-bar select { flex: 1; max-width: 180px; }
        .logs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            animation: slideIn 0.4s ease;
            cursor: pointer;
            transition: all 0.2s;
        }
        .log-item:hover { background: rgba(255,255,255,0.06); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-item.command { border-left-color: var(--accent-2); }
        .log-item.new_message { border-left-color: #3b82f6; }
        .log-item.deletion { border-left-color: var(--error); }
        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .log-details {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .log-item.expanded .log-details {
            -webkit-line-clamp: unset;
            display: block;
        }
        .log-details span { color: var(--text-primary); font-weight: 500; }
        .empty-logs {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 0;
            font-size: 14px;
        }
        .console-wrapper {
            background: #0d0d14;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .console-output {
            flex: 1;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            color: var(--success);
            line-height: 1.6;
        }
        .console-line { margin-bottom: 4px; word-wrap: break-word; }
        .console-line.error { color: var(--error); }
        .console-line.info { color: #3b82f6; }
        .console-line.success { color: var(--success); }
        .console-line.cmd { color: var(--accent-2); }
        .console-input-group {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
        }
        .console-input-group input {
            flex: 1;
            font-family: 'Courier New', monospace;
            letter-spacing: normal;
            padding: 12px 16px;
            font-size: 14px;
        }
        .console-input-group button {
            padding: 12px 24px;
            font-size: 14px;
        }
        .cmd-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255,255,255,0.02);
        }
        .chip {
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: var(--accent-2);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }
        .bans-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .bans-table th {
            text-align: left;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }
        .bans-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .bans-table tr:hover { background: rgba(255,255,255,0.02); }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.perm { background: rgba(239,68,68,0.2); color: var(--error); }
        .badge.temp { background: rgba(245,158,11,0.2); color: var(--warning); }
        .btn-mini {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-mini:hover { background: rgba(239, 68, 68, 0.4); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-2);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .chart-container {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            height: 300px;
        }
        .fade-out {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .fade-in { opacity: 1; transform: translateY(0); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        @media (max-width: 768px) {
            #canvas-container { display: none; }
            .overlay { background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1a2e 100%); }
            .card { padding: 24px 20px; border-radius: 16px; }
            .card h1 { font-size: 22px; }
            .tabs { gap: 4px; }
            .tab { padding: 10px 14px; font-size: 12px; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .search-bar { flex-direction: column; }
            .search-bar select { max-width: unset; }
            .stats-grid { grid-template-columns: 1fr; }
        }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 300;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #14141e;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 20px; font-size: 22px; }
        .modal-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }
        .modal-btn:hover { background: rgba(255,255,255,0.05); }
        .ping-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .ping-row:last-child { margin-bottom: 0; }
        .ping-value { font-weight: 600; color: var(--success); }
        .trace-steps {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .trace-step {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            font-size: 13px;
        }
        .trace-step-time {
            color: var(--text-secondary);
            font-size: 11px;
            font-family: monospace;
            min-width: 60px;
        }
        .trace-step-text { flex: 1; }
    </style>
</head>
<body>
    <!-- ===== LOADER ===== -->
    <div class="loader-screen" id="loader-screen">
        <div class="loader">
            <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="chipGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#2d2d2d"></stop>
                        <stop offset="100%" stop-color="#0f0f0f"></stop>
                    </linearGradient>
                    <linearGradient id="textGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#eeeeee"></stop>
                        <stop offset="100%" stop-color="#888888"></stop>
                    </linearGradient>
                    <linearGradient id="pinGradient" x1="1" y1="0" x2="0" y2="0">
                        <stop offset="0%" stop-color="#bbbbbb"></stop>
                        <stop offset="50%" stop-color="#888888"></stop>
                        <stop offset="100%" stop-color="#555555"></stop>
                    </linearGradient>
                </defs>
                <g id="traces">
                    <path d="M100 100 H200 V210 H326" class="trace-bg"></path>
                    <path d="M100 100 H200 V210 H326" class="trace-flow purple"></path>
                    <path d="M80 180 H180 V230 H326" class="trace-bg"></path>
                    <path d="M80 180 H180 V230 H326" class="trace-flow blue"></path>
                    <path d="M60 260 H150 V250 H326" class="trace-bg"></path>
                    <path d="M60 260 H150 V250 H326" class="trace-flow yellow"></path>
                    <path d="M100 350 H200 V270 H326" class="trace-bg"></path>
                    <path d="M100 350 H200 V270 H326" class="trace-flow green"></path>
                    <path d="M700 90 H560 V210 H474" class="trace-bg"></path>
                    <path d="M700 90 H560 V210 H474" class="trace-flow blue"></path>
                    <path d="M740 160 H580 V230 H474" class="trace-bg"></path>
                    <path d="M740 160 H580 V230 H474" class="trace-flow green"></path>
                    <path d="M720 250 H590 V250 H474" class="trace-bg"></path>
                    <path d="M720 250 H590 V250 H474" class="trace-flow red"></path>
                    <path d="M680 340 H570 V270 H474" class="trace-bg"></path>
                    <path d="M680 340 H570 V270 H474" class="trace-flow yellow"></path>
                </g>
                <rect x="330" y="190" width="140" height="100" rx="20" ry="20" fill="url(#chipGradient)" stroke="#222" stroke-width="3" filter="drop-shadow(0 0 6px rgba(0,0,0,0.8))"></rect>
                <g>
                    <rect x="322" y="205" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                    <rect x="322" y="225" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                    <rect x="322" y="245" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                    <rect x="322" y="265" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                </g>
                <g>
                    <rect x="470" y="205" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                    <rect x="470" y="225" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                    <rect x="470" y="245" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                    <rect x="470" y="265" width="8" height="10" fill="url(#pinGradient)" rx="2"></rect>
                </g>
                <text x="400" y="240" font-family="Arial, sans-serif" font-size="22" fill="url(#textGradient)" text-anchor="middle" alignment-baseline="middle">Loading</text>
                <circle cx="100" cy="100" r="5" fill="black"></circle>
                <circle cx="80" cy="180" r="5" fill="black"></circle>
                <circle cx="60" cy="260" r="5" fill="black"></circle>
                <circle cx="100" cy="350" r="5" fill="black"></circle>
                <circle cx="700" cy="90" r="5" fill="black"></circle>
                <circle cx="740" cy="160" r="5" fill="black"></circle>
                <circle cx="720" cy="250" r="5" fill="black"></circle>
                <circle cx="680" cy="340" r="5" fill="black"></circle>
            </svg>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div class="overlay" id="overlay">
        <!-- Экран входа -->
        <div class="card" id="login-card" style="max-width: 420px;">
            <h1>Access Panel</h1>
            <p>Введите пароль для входа</p>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="••••••••" autocomplete="off">
                <button onclick="checkPassword()">Войти</button>
            </div>
            <div class="error" id="error-msg"></div>
        </div>

        <!-- Дашборд -->
        <div class="card success-content" id="success-card">
            <div class="top-bar">
                <div class="status-indicator">
                    <span class="status-dot unknown" id="bot-status-dot"></span>
                    <span id="bot-status-text">Проверка статуса...</span>
                </div>
                <div class="top-actions">
                    <button class="ping-btn" onclick="showPingModal()">🏓 Пинг</button>
                    <button class="theme-btn" onclick="cycleTheme()">🎨 Тема</button>
                    <button class="logout-btn" onclick="logout()">Выйти</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab(event, 'logs')">📊 Логи</button>
                <button class="tab" onclick="switchTab(event, 'console')">💻 Консоль</button>
                <button class="tab" onclick="switchTab(event, 'bans')">🚫 Баны</button>
                <button class="tab" onclick="switchTab(event, 'stats')">📈 Аналитика</button>
                <button class="tab" onclick="switchTab(event, 'alerts')">🔔 Алерты</button>
            </div>

            <div class="tab-content active" id="tab-logs">
                <div class="search-bar">
                    <input type="text" id="logs-search" placeholder="Поиск по логам..." oninput="renderLogs()">
                    <select id="logs-filter" onchange="renderLogs()">
                        <option value="all">Все события</option>
                        <option value="command">Команды</option>
                        <option value="new_message">Сообщения</option>
                        <option value="deletion">Удаления</option>
                    </select>
                </div>
                <div class="logs-container" id="logs-container">
                    <div class="empty-logs">Загрузка логов...</div>
                </div>
            </div>

            <div class="tab-content" id="tab-console">
                <div class="console-wrapper">
                    <div class="cmd-chips" id="cmd-chips">
                        <div class="chip" onclick="insertCmd('.ping')">.ping</div>
                    </div>
                    <div class="console-output" id="console-output">
                        <div class="console-line info">Добро пожаловать в консоль.</div>
                    </div>
                    <div class="console-input-group">
                        <input type="text" id="console-input" placeholder="Введите команду..." autocomplete="off" spellcheck="false">
                        <button onclick="executeConsoleCommand()" id="console-btn">Выполнить</button>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-bans">
                <div id="bans-container">
                    <div class="empty-logs">Загрузка банов...</div>
                </div>
            </div>

            <div class="tab-content" id="tab-stats">
                <div class="stats-grid" id="stats-grid"></div>
                <div class="chart-container">
                    <canvas id="activity-chart"></canvas>
                </div>
            </div>

            <div class="tab-content" id="tab-alerts">
                <div id="alerts-container">
                    <div class="empty-logs">Загрузка алертов...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка Ping -->
    <div class="modal" id="ping-modal" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content">
            <h2>🏓 Пинг</h2>
            <div id="ping-content">
                <div style="text-align:center;color:rgba(255,255,255,0.5);padding:20px;">Измерение...</div>
            </div>
            <button class="modal-btn" onclick="document.getElementById('ping-modal').classList.remove('active')">Закрыть</button>
        </div>
    </div>

    <!-- Модалка Трассировки -->
    <div class="modal" id="trace-modal" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content">
            <h2>🔍 Трассировка запроса</h2>
            <div id="trace-content">
                <div style="text-align:center;color:rgba(255,255,255,0.5);padding:20px;">Загрузка...</div>
            </div>
            <button class="modal-btn" onclick="document.getElementById('trace-modal').classList.remove('active')">Закрыть</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ===== LOADER HIDE =====
        setTimeout(() => {
            document.getElementById('loader-screen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('overlay').classList.add('visible');
            }, 200);
        }, 3500);

        // ===== 3D =====
        const isMobile = window.innerWidth < 768;
        if (!isMobile) {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 30);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85));

            scene.add(new THREE.AmbientLight(0x404060, 0.5));
            const pl1 = new THREE.PointLight(0x6366f1, 2, 50);
            pl1.position.set(10, 10, 10);
            scene.add(pl1);
            const pl2 = new THREE.PointLight(0x8b5cf6, 2, 50);
            pl2.position.set(-10, -10, 10);
            scene.add(pl2);

            const knot = new THREE.Mesh(
                new THREE.TorusKnotGeometry(6, 1.8, 200, 32),
                new THREE.MeshStandardMaterial({ color: 0x6366f1, emissive: 0x1a1a4e, metalness: 0.9, roughness: 0.15 })
            );
            scene.add(knot);

            const particlesGeo = new THREE.BufferGeometry();
            const pos = new Float32Array(3000 * 3);
            for (let i = 0; i < pos.length; i++) pos[i] = (Math.random() - 0.5) * 120;
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const particles = new THREE.Points(particlesGeo, new THREE.PointsMaterial({
                size: 0.15, color: 0x8888ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
            }));
            scene.add(particles);

            let mx = 0, my = 0;
            document.addEventListener('mousemove', e => {
                mx = (e.clientX / window.innerWidth) * 2 - 1;
                my = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            const clock = new THREE.Clock();
            (function animate() {
                requestAnimationFrame(animate);
                const t = clock.getElapsedTime();
                knot.rotation.x = t * 0.3;
                knot.rotation.y = t * 0.4;
                particles.rotation.y = t * 0.02;
                camera.position.x += (mx * 3 - camera.position.x) * 0.02;
                camera.position.y += (my * 3 - camera.position.y) * 0.02;
                camera.lookAt(0, 0, 0);
                composer.render();
            })();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ===== СОСТОЯНИЕ =====
        let adminPassword = '';
        let allEvents = [];
        let logsInterval = null;
        let statusInterval = null;
        let activityChart = null;

        // ===== АВТОРИЗАЦИЯ =====
        window.checkPassword = async function() {
            const input = document.getElementById('password-input');
            const errorEl = document.getElementById('error-msg');
            const password = input.value.trim();
            if (!password) { errorEl.textContent = 'Введите пароль'; return; }
            errorEl.textContent = '';

            try {
                const res = await fetch('/api/check-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.success) {
                    adminPassword = password;
                    document.getElementById('login-card').classList.add('fade-out');
                    setTimeout(() => {
                        document.getElementById('login-card').style.display = 'none';
                        document.getElementById('success-card').style.display = 'block';
                        document.getElementById('success-card').classList.add('fade-in');
                        initDashboard();
                    }, 300);
                } else {
                    errorEl.textContent = 'Неверный пароль';
                    input.value = '';
                }
            } catch (err) {
                errorEl.textContent = 'Ошибка соединения';
            }
        };

        window.logout = function() {
            adminPassword = '';
            clearInterval(logsInterval);
            clearInterval(statusInterval);
            document.getElementById('login-card').style.display = 'block';
            document.getElementById('login-card').classList.remove('fade-out');
            document.getElementById('success-card').style.display = 'none';
            document.getElementById('password-input').value = '';
        };

        function initDashboard() {
            loadCommands();
            loadLogs();
            loadBans();
            loadAlerts();
            checkStatus();
            logsInterval = setInterval(() => { loadLogs(); loadBans(); loadAlerts(); }, 5000);
            statusInterval = setInterval(checkStatus, 10000);
        }

        // ===== ТЕМЫ =====
        const themes = ['default', 'cyberpunk', 'oxford'];
        let currentTheme = localStorage.getItem('theme') || 'default';
        document.documentElement.setAttribute('data-theme', currentTheme);

        window.cycleTheme = function() {
            const idx = themes.indexOf(currentTheme);
            currentTheme = themes[(idx + 1) % themes.length];
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
        };

        // ===== ТАБЫ =====
        window.switchTab = function(event, name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'bans') loadBans();
            if (name === 'stats') renderStats();
            if (name === 'alerts') loadAlerts();
        };

        // ===== КОМАНДЫ =====
        async function loadCommands() {
            try {
                const res = await fetch('/api/commands', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                const container = document.getElementById('cmd-chips');
                if (data.commands && data.commands.length > 0) {
                    container.innerHTML = data.commands.map(c =>
                        `<div class="chip" onclick="insertCmd('${c} ')">${c}</div>`
                    ).join('') + '<div class="chip" onclick="clearConsole()">clear</div>';
                }
            } catch (err) { console.error(err); }
        }

        // ===== ЛОГИ =====
        async function loadLogs() {
            try {
                const res = await fetch('/api/events', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                allEvents = data.events || [];
                renderLogs();
            } catch (err) { console.error(err); }
        }

        window.renderLogs = function() {
            const container = document.getElementById('logs-container');
            const search = document.getElementById('logs-search').value.toLowerCase();
            const filter = document.getElementById('logs-filter').value;

            let filtered = allEvents;
            if (filter !== 'all') filtered = filtered.filter(e => e.action === filter);
            if (search) {
                filtered = filtered.filter(e => {
                    const d = e.data || {};
                    return JSON.stringify(d).toLowerCase().includes(search);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-logs">Нет событий</div>';
                return;
            }

            container.innerHTML = filtered.map((ev, i) => {
                const date = new Date(ev.timestamp);
                const timeStr = date.toLocaleString('ru-RU');
                const action = ev.action || 'unknown';
                const d = ev.data || {};
                let label = action, cls = 'log-item', details = '';

                if (action === 'command') {
                    label = '⌨️ Команда'; cls += ' command';
                    details = `<div>Команда: <span>${d.command || '—'}</span></div>`;
                } else if (action === 'new_message') {
                    label = '💬 Сообщение'; cls += ' new_message';
                    details = `<div>От: <span>${d.sender_id || '—'}</span></div>
                               <div>Текст: <span>${escapeHtml(d.text || '—')}</span></div>`;
                } else if (action === 'deletion') {
                    label = '🗑️ Удаление'; cls += ' deletion';
                    details = `<div>Чат: <span>${d.chat_id || '—'}</span></div>`;
                } else {
                    details = `<div>${escapeHtml(JSON.stringify(d))}</div>`;
                }

                const traceId = d.request_id || '';
                const clickHandler = traceId
                    ? `onclick="showTrace('${traceId}')"`
                    : `onclick="this.classList.toggle('expanded')"`;

                return `<div class="${cls}" ${clickHandler}>
                    <div class="log-header"><span>${label}</span><span>${timeStr}</span></div>
                    <div class="log-details">${details}</div>
                </div>`;
            }).join('');
        };

        // ===== СТАТУС =====
        async function checkStatus() {
            try {
                const res = await fetch('/api/status', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                const dot = document.getElementById('bot-status-dot');
                const text = document.getElementById('bot-status-text');

                if (!data.online) {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Бот офлайн';
                } else if (data.healthcheck_ok === false || (data.ping && data.ping > 3000)) {
                    dot.className = 'status-dot degraded';
                    text.textContent = `Деградация (${data.ping || '?'}ms)`;
                } else {
                    dot.className = 'status-dot';
                    text.textContent = `Бот онлайн (${data.ping || '?'}ms)`;
                }
            } catch (err) {
                document.getElementById('bot-status-dot').className = 'status-dot unknown';
                document.getElementById('bot-status-text').textContent = 'Статус неизвестен';
            }
        }

        // ===== БАНЫ =====
        async function loadBans() {
            try {
                const res = await fetch('/api/bans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
                    body: JSON.stringify({ action: 'list' })
                });
                const data = await res.json();
                const container = document.getElementById('bans-container');

                if (!data.bans || data.bans.length === 0) {
                    container.innerHTML = `<table class="bans-table">
                        <thead><tr><th>ID</th><th>Username</th><th>Время</th><th>Причина</th><th></th></tr></thead>
                        <tbody><tr><td colspan="5" style="text-align:center;color:rgba(255,255,255,0.4);">Бан-лист пуст</td></tr></tbody>
                    </table>`;
                    return;
                }

                container.innerHTML = `<table class="bans-table">
                    <thead><tr><th>ID</th><th>Username</th><th>Время</th><th>Причина</th><th></th></tr></thead>
                    <tbody>${data.bans.map(b => `<tr>
                        <td>${b.id || '—'}</td>
                        <td>@${b.username || 'нет'}</td>
                        <td><span class="badge ${b.time === 'forever' ? 'perm' : 'temp'}">${b.time || 'forever'}</span></td>
                        <td>${escapeHtml(b.reason || '—')}</td>
                        <td><button class="btn-mini" onclick="removeBan(${b.id}, '${b.username || ''}')">Разбанить</button></td>
                    </tr>`).join('')}</tbody>
                </table>`;
            } catch (err) { console.error(err); }
        }

        window.removeBan = async function(id, username) {
            if (!confirm(`Разбанить ${username || id}?`)) return;
            try {
                const res = await fetch('/api/bans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
                    body: JSON.stringify({ action: 'remove', ban: { id: id, username: username } })
                });
                const data = await res.json();
                if (data.status === 'ok') loadBans();
            } catch (err) { console.error(err); }
        };

        // ===== АЛЕРТЫ =====
        async function loadAlerts() {
            try {
                const res = await fetch('/api/alerts', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                const container = document.getElementById('alerts-container');

                if (!data.alerts || data.alerts.length === 0) {
                    container.innerHTML = '<div class="empty-logs">Алертов нет — всё хорошо ✅</div>';
                    return;
                }

                container.innerHTML = data.alerts.map(a => {
                    const date = new Date(a.timestamp);
                    const timeStr = date.toLocaleString('ru-RU');
                    const color = a.type === 'degradation' ? 'var(--warning)' : 'var(--error)';
                    return `<div class="log-item" style="border-left-color:${color};">
                        <div class="log-header"><span>🔔 ${a.type}</span><span>${timeStr}</span></div>
                        <div class="log-details">${escapeHtml(a.message || '')}</div>
                    </div>`;
                }).join('');
            } catch (err) { console.error(err); }
        }

        // ===== АНАЛИТИКА =====
        function renderStats() {
            const statsGrid = document.getElementById('stats-grid');
            const total = allEvents.length;
            const commands = allEvents.filter(e => e.action === 'command').length;
            const messages = allEvents.filter(e => e.action === 'new_message').length;
            const deletions = allEvents.filter(e => e.action === 'deletion').length;

            statsGrid.innerHTML = `
                <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Всего событий</div></div>
                <div class="stat-card"><div class="stat-value">${commands}</div><div class="stat-label">Команд</div></div>
                <div class="stat-card"><div class="stat-value">${messages}</div><div class="stat-label">Сообщений</div></div>
                <div class="stat-card"><div class="stat-value">${deletions}</div><div class="stat-label">Удалений</div></div>
            `;

            const hours = Array(24).fill(0);
            allEvents.forEach(e => {
                const h = new Date(e.timestamp).getHours();
                hours[h]++;
            });

            const ctx = document.getElementById('activity-chart').getContext('2d');
            if (activityChart) activityChart.destroy();
            activityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        label: 'События',
                        data: hours,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        tension: 0.4,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        // ===== ПИНГ =====
        window.showPingModal = async function() {
            const modal = document.getElementById('ping-modal');
            const content = document.getElementById('ping-content');
            modal.classList.add('active');
            content.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);padding:20px;">Измерение...</div>';

            try {
                const t0 = performance.now();
                const res = await fetch('/api/status', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                const sitePing = Math.round(performance.now() - t0);

                content.innerHTML = `
                    <div class="ping-row">
                        <span>Telegram API</span>
                        <span class="ping-value">${data.ping || '—'}ms</span>
                    </div>
                    <div class="ping-row">
                        <span>Site API (браузер)</span>
                        <span class="ping-value">${sitePing}ms</span>
                    </div>
                    <div class="ping-row">
                        <span>Site API (бот)</span>
                        <span class="ping-value">${data.site_ping || '—'}ms</span>
                    </div>
                    <div class="ping-row">
                        <span>Статус</span>
                        <span class="ping-value" style="color:${data.online ? 'var(--success)' : 'var(--error)'};">${data.online ? '✅ Онлайн' : '❌ Офлайн'}</span>
                    </div>
                    <div class="ping-row">
                        <span>Healthcheck</span>
                        <span class="ping-value" style="color:${data.healthcheck_ok ? 'var(--success)' : 'var(--warning)'};">${data.healthcheck_ok ? '✅ OK' : '⚠️ Деградация'}</span>
                    </div>
                `;
            } catch (err) {
                content.innerHTML = `<div style="color:var(--error);">Ошибка: ${err.message}</div>`;
            }
        };

        // ===== ТРАССИРОВКА =====
        window.showTrace = async function(requestId) {
            const modal = document.getElementById('trace-modal');
            const content = document.getElementById('trace-content');
            modal.classList.add('active');
            content.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);padding:20px;">Загрузка...</div>';

            try {
                const res = await fetch(`/api/trace?id=${requestId}`, {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();

                if (!data.trace || !data.trace.steps) {
                    content.innerHTML = '<div style="color:rgba(255,255,255,0.5);">Трассировка не найдена</div>';
                    return;
                }

                const firstTime = data.trace.steps[0]?.timestamp || 0;
                content.innerHTML = `
                    <div style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:12px;">Request ID: ${requestId}</div>
                    <div class="trace-steps">
                        ${data.trace.steps.map(step => {
                            const offset = step.timestamp - firstTime;
                            return `<div class="trace-step">
                                <div class="trace-step-time">+${offset}ms</div>
                                <div class="trace-step-text">${escapeHtml(step.step)}</div>
                            </div>`;
                        }).join('')}
                    </div>
                `;
            } catch (err) {
                content.innerHTML = `<div style="color:var(--error);">Ошибка: ${err.message}</div>`;
            }
        };

        // ===== КОНСОЛЬ =====
        window.insertCmd = function(cmd) {
            document.getElementById('console-input').value = cmd;
            document.getElementById('console-input').focus();
        };
        window.clearConsole = function() {
            document.getElementById('console-output').innerHTML = '<div class="console-line info">Консоль очищена.</div>';
        };

        window.executeConsoleCommand = async function() {
            const input = document.getElementById('console-input');
            const btn = document.getElementById('console-btn');
            const cmd = input.value.trim();
            if (!cmd) return;

            const output = document.getElementById('console-output');
            output.innerHTML += `<div class="console-line cmd">> ${escapeHtml(cmd)}</div>`;
            input.value = '';
            output.scrollTop = output.scrollHeight;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Отправка...';

            try {
                const res = await fetch('/api/console', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                const cls = data.status === 'ok' ? 'success' : 'error';
                output.innerHTML += `<div class="console-line ${cls}">${escapeHtml(data.message || JSON.stringify(data))}</div>`;

                if (cmd !== 'clear' && !cmd.startsWith('.connect') && !cmd.startsWith('.unconnect')) {
                    let attempts = 0;
                    const pollResult = setInterval(async () => {
                        attempts++;
                        try {
                            const r = await fetch('/api/console_result', {
                                headers: { 'X-Admin-Password': adminPassword }
                            });
                            const rd = await r.json();
                            if (rd.result && rd.result.timestamp > Date.now() - 30000) {
                                output.innerHTML += `<div class="console-line success">📥 ${escapeHtml(rd.result.result)}</div>`;
                                output.scrollTop = output.scrollHeight;
                                clearInterval(pollResult);
                            }
                        } catch (e) {}
                        if (attempts > 20) clearInterval(pollResult);
                    }, 1000);
                }
            } catch (err) {
                output.innerHTML += `<div class="console-line error">Ошибка: ${err.message}</div>`;
            }

            btn.disabled = false;
            btn.textContent = 'Выполнить';
            output.scrollTop = output.scrollHeight;
        };

        const cmdHistory = [];
        let historyIndex = -1;
        document.getElementById('console-input').addEventListener('keydown', (e) => {
            const input = e.target;
            if (e.key === 'Enter') {
                if (input.value.trim()) {
                    cmdHistory.push(input.value.trim());
                    historyIndex = cmdHistory.length;
                }
                executeConsoleCommand();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (cmdHistory.length > 0) {
                    historyIndex = Math.max(0, historyIndex - 1);
                    input.value = cmdHistory[historyIndex] || '';
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < cmdHistory.length - 1) {
                    historyIndex++;
                    input.value = cmdHistory[historyIndex];
                } else {
                    historyIndex = cmdHistory.length;
                    input.value = '';
                }
            }
        });

        document.getElementById('password-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') checkPassword();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
