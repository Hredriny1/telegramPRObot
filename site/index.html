<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSave — Bot Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(8px);
            overflow-y: auto;
            padding: 20px;
        }
        .card {
            background: rgba(20, 20, 30, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 48px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a0a0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }
        input {
            flex: 1;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: rgba(100, 100, 255, 0.6);
            background: rgba(100, 100, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(100, 100, 255, 0.1);
        }
        button {
            padding: 16px 28px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.4);
        }
        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
            height: 18px;
        }
        .success-content { display: none; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }
        .status-dot.offline { background: #ef4444; animation: none; }
        .status-dot.unknown { background: #f59e0b; animation: none; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            font-family: inherit;
        }
        .tab:hover { color: #fff; }
        .tab.active {
            color: #fff;
            border-bottom-color: #6366f1;
        }

        .tab-content { display: none; text-align: left; }
        .tab-content.active { display: block; }

        .logs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .log-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #6366f1;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .log-item.command { border-left-color: #8b5cf6; }
        .log-item.new_message { border-left-color: #3b82f6; }
        .log-item.deletion { border-left-color: #ef4444; }
        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .log-details {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            line-height: 1.5;
        }
        .log-details span { color: #fff; font-weight: 500; }
        .empty-logs {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            padding: 40px 0;
            font-size: 14px;
        }

        /* Консоль */
        .console-wrapper {
            background: #0d0d14;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 450px;
        }
        .console-output {
            flex: 1;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-y: auto;
            color: #22c55e;
            line-height: 1.6;
        }
        .console-line { margin-bottom: 4px; word-wrap: break-word; }
        .console-line.error { color: #ef4444; }
        .console-line.info { color: #3b82f6; }
        .console-line.success { color: #22c55e; }
        .console-line.cmd { color: #a0a0ff; }
        .console-input-group {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }
        .console-input-group input {
            flex: 1;
            font-family: 'Courier New', monospace;
            letter-spacing: normal;
            padding: 12px 16px;
            font-size: 14px;
        }
        .console-input-group button {
            padding: 12px 24px;
            font-size: 14px;
        }
        .cmd-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }
        .chip {
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: #a0a0ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: rgba(99, 102, 241, 0.3);
            transform: translateY(-1px);
        }

        /* База данных (баны) */
        .bans-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .bans-table th {
            text-align: left;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .bans-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .bans-table tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.perm { background: rgba(239,68,68,0.2); color: #ef4444; }
        .badge.temp { background: rgba(245,158,11,0.2); color: #f59e0b; }

        .logout-btn {
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .fade-out {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay" id="overlay">
        <!-- Экран входа -->
        <div class="card" id="login-card" style="max-width: 420px;">
            <h1>Access Panel</h1>
            <p>Введите пароль для входа</p>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="••••••••" autocomplete="off">
                <button onclick="checkPassword()">Войти</button>
            </div>
            <div class="error" id="error-msg"></div>
        </div>

        <!-- Основной дашборд -->
        <div class="card success-content" id="success-card">
            <div class="top-bar">
                <div class="status-indicator">
                    <span class="status-dot unknown" id="bot-status-dot"></span>
                    <span id="bot-status-text">Проверка статуса...</span>
                </div>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('logs')">📊 Логи</button>
                <button class="tab" onclick="switchTab('console')">💻 Консоль</button>
                <button class="tab" onclick="switchTab('bans')">🚫 Баны</button>
            </div>

            <!-- Логи -->
            <div class="tab-content active" id="tab-logs">
                <div class="logs-container" id="logs-container">
                    <div class="empty-logs">Загрузка логов...</div>
                </div>
            </div>

            <!-- Консоль -->
            <div class="tab-content" id="tab-console">
                <div class="console-wrapper">
                    <div class="cmd-chips">
                        <div class="chip" onclick="insertCmd('.ban ')">.ban</div>
                        <div class="chip" onclick="insertCmd('.unban ')">.unban</div>
                        <div class="chip" onclick="insertCmd('.idlist')">.idlist</div>
                        <div class="chip" onclick="insertCmd('.banlist')">.banlist</div>
                        <div class="chip" onclick="insertCmd('.checkban ')">.checkban</div>
                        <div class="chip" onclick="insertCmd('.ai ')">.ai</div>
                        <div class="chip" onclick="insertCmd('.mute ')">.mute</div>
                        <div class="chip" onclick="insertCmd('.unmute')">.unmute</div>
                        <div class="chip" onclick="insertCmd('.ping')">.ping</div>
                        <div class="chip" onclick="clearConsole()">clear</div>
                    </div>
                    <div class="console-output" id="console-output">
                        <div class="console-line info">Добро пожаловать в консоль управления ботом.</div>
                        <div class="console-line info">Введите команду или кликните на чип выше.</div>
                    </div>
                    <div class="console-input-group">
                        <input type="text" id="console-input" placeholder="Введите команду..." autocomplete="off" spellcheck="false">
                        <button onclick="executeConsoleCommand()">Выполнить</button>
                    </div>
                </div>
            </div>

            <!-- Баны -->
            <div class="tab-content" id="tab-bans">
                <div id="bans-container">
                    <div class="empty-logs">Загрузка банов...</div>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ===== 3D СЦЕНА =====
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.85
        ));

        scene.add(new THREE.AmbientLight(0x404060, 0.5));
        const pl1 = new THREE.PointLight(0x6366f1, 2, 50);
        pl1.position.set(10, 10, 10);
        scene.add(pl1);
        const pl2 = new THREE.PointLight(0x8b5cf6, 2, 50);
        pl2.position.set(-10, -10, 10);
        scene.add(pl2);

        const knot = new THREE.Mesh(
            new THREE.TorusKnotGeometry(6, 1.8, 200, 32),
            new THREE.MeshStandardMaterial({ color: 0x6366f1, emissive: 0x1a1a4e, metalness: 0.9, roughness: 0.15 })
        );
        scene.add(knot);

        const particlesGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(3000 * 3);
        for (let i = 0; i < 3000 * 3; i++) posArray[i] = (Math.random() - 0.5) * 120;
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particles = new THREE.Points(particlesGeo, new THREE.PointsMaterial({
            size: 0.15, color: 0x8888ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
        }));
        scene.add(particles);

        const ringGeo = new THREE.TorusGeometry(12, 0.08, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.2 });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 2;
        scene.add(ring1);
        const ring2 = new THREE.Mesh(ringGeo, ringMat);
        ring2.rotation.x = Math.PI / 3;
        ring2.rotation.y = Math.PI / 4;
        scene.add(ring2);

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            knot.rotation.x = t * 0.3;
            knot.rotation.y = t * 0.4;
            const s = 1 + Math.sin(t * 2) * 0.03;
            knot.scale.set(s, s, s);
            particles.rotation.y = t * 0.02;
            ring1.rotation.z = t * 0.1;
            ring2.rotation.z = -t * 0.15;
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.02;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);
            pl1.position.x = Math.sin(t * 0.5) * 15;
            pl1.position.y = Math.cos(t * 0.5) * 15;
            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== АВТОРИЗАЦИЯ =====
        let isLoggedIn = false;
        let adminPassword = '';
        let logsInterval = null;
        let statusInterval = null;
        let consolePollInterval = null;

        window.checkPassword = async function() {
            const input = document.getElementById('password-input');
            const errorEl = document.getElementById('error-msg');
            const password = input.value.trim();

            if (!password) {
                errorEl.textContent = 'Введите пароль';
                return;
            }
            errorEl.textContent = '';

            try {
                const response = await fetch('/api/check-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (data.success) {
                    isLoggedIn = true;
                    adminPassword = password;
                    sessionStorage.setItem('admin_pass', password);

                    const loginCard = document.getElementById('login-card');
                    const successCard = document.getElementById('success-card');
                    loginCard.classList.add('fade-out');
                    setTimeout(() => {
                        loginCard.style.display = 'none';
                        successCard.style.display = 'block';
                        successCard.classList.add('fade-in');
                        loadLogs();
                        loadBans();
                        checkStatus();
                        logsInterval = setInterval(loadLogs, 5000);
                        statusInterval = setInterval(checkStatus, 10000);
                    }, 300);
                } else {
                    errorEl.textContent = 'Неверный пароль';
                    input.value = '';
                }
            } catch (err) {
                errorEl.textContent = 'Ошибка соединения';
            }
        };

        window.logout = function() {
            isLoggedIn = false;
            adminPassword = '';
            sessionStorage.removeItem('admin_pass');
            clearInterval(logsInterval);
            clearInterval(statusInterval);
            clearInterval(consolePollInterval);
            document.getElementById('login-card').style.display = 'block';
            document.getElementById('login-card').classList.remove('fade-out');
            document.getElementById('success-card').style.display = 'none';
            document.getElementById('password-input').value = '';
        };

        window.switchTab = function(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
            if (name === 'bans') loadBans();
        };

        // ===== ЛОГИ =====
        async function loadLogs() {
            try {
                const res = await fetch('/api/events', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                const container = document.getElementById('logs-container');

                if (!data.events || data.events.length === 0) {
                    container.innerHTML = '<div class="empty-logs">Пока нет событий</div>';
                    return;
                }

                container.innerHTML = data.events.map(ev => {
                    const date = new Date(ev.timestamp);
                    const timeStr = date.toLocaleString('ru-RU');
                    const action = ev.action || 'unknown';
                    const d = ev.data || {};
                    let label = action, cls = 'log-item', details = '';

                    if (action === 'command') {
                        label = '⌨️ Команда'; cls += ' command';
                        details = `<div>Команда: <span>${d.command || '—'}</span></div>
                                   <div>ID чата: <span>${d.chat_id || '—'}</span></div>`;
                    } else if (action === 'new_message') {
                        label = '💬 Сообщение'; cls += ' new_message';
                        details = `<div>От: <span>${d.sender_id || '—'}</span></div>
                                   <div>Текст: <span>${escapeHtml(d.text || '—')}</span></div>`;
                    } else if (action === 'deletion') {
                        label = '🗑️ Удаление'; cls += ' deletion';
                        details = `<div>Чат: <span>${d.chat_id || '—'}</span></div>`;
                    } else {
                        details = `<div>${escapeHtml(JSON.stringify(d))}</div>`;
                    }

                    return `<div class="${cls}">
                        <div class="log-header"><span>${label}</span><span>${timeStr}</span></div>
                        <div class="log-details">${details}</div>
                    </div>`;
                }).join('');
            } catch (err) { console.error(err); }
        }

        // ===== СТАТУС БОТА =====
        async function checkStatus() {
            try {
                const res = await fetch('/api/status', {
                    headers: { 'X-Admin-Password': adminPassword }
                });
                const data = await res.json();
                const dot = document.getElementById('bot-status-dot');
                const text = document.getElementById('bot-status-text');

                if (data.online) {
                    dot.className = 'status-dot';
                    text.textContent = `Бот онлайн (${data.ping || '?'}ms)`;
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = 'Бот офлайн';
                }
            } catch (err) {
                document.getElementById('bot-status-dot').className = 'status-dot unknown';
                document.getElementById('bot-status-text').textContent = 'Статус неизвестен';
            }
        }

        // ===== БАНЫ =====
        async function loadBans() {
            try {
                const res = await fetch('/api/bans', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
                    body: JSON.stringify({ action: 'list' })
                });
                const data = await res.json();
                const container = document.getElementById('bans-container');

                if (!data.bans || data.bans.length === 0) {
                    container.innerHTML = '<div class="empty-logs">Бан-лист пуст</div>';
                    return;
                }

                container.innerHTML = `<table class="bans-table">
                    <thead><tr><th>ID</th><th>Username</th><th>Время</th><th>Причина</th></tr></thead>
                    <tbody>${data.bans.map(b => `<tr>
                        <td>${b.id || '—'}</td>
                        <td>@${b.username || 'нет'}</td>
                        <td><span class="badge ${b.time === 'forever' ? 'perm' : 'temp'}">${b.time || 'forever'}</span></td>
                        <td>${escapeHtml(b.reason || '—')}</td>
                    </tr>`).join('')}</tbody>
                </table>`;
            } catch (err) { console.error(err); }
        }

        // ===== КОНСОЛЬ =====
        window.insertCmd = function(cmd) {
            const input = document.getElementById('console-input');
            input.value = cmd;
            input.focus();
        };

        window.clearConsole = function() {
            document.getElementById('console-output').innerHTML =
                '<div class="console-line info">Консоль очищена.</div>';
        };

        window.executeConsoleCommand = async function() {
            const input = document.getElementById('console-input');
            const cmd = input.value.trim();
            if (!cmd) return;

            const output = document.getElementById('console-output');
            output.innerHTML += `<div class="console-line cmd">> ${escapeHtml(cmd)}</div>`;
            input.value = '';
            output.scrollTop = output.scrollHeight;

            try {
                const res = await fetch('/api/console', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                const cls = data.status === 'ok' ? 'success' : 'error';
                output.innerHTML += `<div class="console-line ${cls}">${escapeHtml(data.message || JSON.stringify(data))}</div>`;
            } catch (err) {
                output.innerHTML += `<div class="console-line error">Ошибка: ${err.message}</div>`;
            }
            output.scrollTop = output.scrollHeight;
        };

        // История команд (стрелки вверх/вниз)
        const cmdHistory = [];
        let historyIndex = -1;

        document.getElementById('console-input').addEventListener('keydown', (e) => {
            const input = e.target;
            if (e.key === 'Enter') {
                if (input.value.trim()) {
                    cmdHistory.push(input.value.trim());
                    historyIndex = cmdHistory.length;
                }
                executeConsoleCommand();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (cmdHistory.length > 0) {
                    historyIndex = Math.max(0, historyIndex - 1);
                    input.value = cmdHistory[historyIndex] || '';
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < cmdHistory.length - 1) {
                    historyIndex++;
                    input.value = cmdHistory[historyIndex];
                } else {
                    historyIndex = cmdHistory.length;
                    input.value = '';
                }
            }
        });

        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
